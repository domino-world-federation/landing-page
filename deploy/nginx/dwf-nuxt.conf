# nginx for the Nuxt port of the DWF prototype.
#
# Adapted from landing-page/deploy/nginx/proto-dwf.moonthesky.com.conf. Most of
# it is unchanged, because most of it is about the SITE rather than the
# framework. The four blocks that DID change carry a note saying why; everything
# else is the Next config's reasoning, still true.
#
#   sudo ln -s .../deploy/nginx/dwf-nuxt.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS is not in this file, as it is not in the Next one: certbot writes the 443
# block when the certificate is issued.

server {
    listen 80;
    listen [::]:80;

    # ── SET THIS ────────────────────────────────────────────────────────────
    # A placeholder. The Next prototype answers on `fed-web.pborado.com`, and
    # two server blocks cannot both claim one name — nginx would take the first
    # it loaded and quietly ignore the other. Give this its own hostname before
    # enabling the file.
    server_name nuxt-fed-web.pborado.com;

    # Certbot writes its challenge here and reads it back over plain HTTP. Kept
    # explicit so a renewal cannot be swallowed by the proxy rule below.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # No uploads anywhere on the site; the newsletter and contact forms have no
    # backend at all (blocker B2). A small ceiling costs nothing and closes an
    # obvious way to waste the box's disk.
    client_max_body_size 1m;

    # CHANGED — reason, not values. Nitro sends no `content-encoding` of its own
    # (measured on a built server), exactly as Next sent none, so nginx is still
    # the only thing compressing and the list below is unchanged.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/rss+xml;
    # Deliberately not gzipping png/jpg/webp: they are already compressed, and
    # re-compressing costs CPU for a few bytes. This site's images are its
    # weight (25 assets over 1MB, PRD R10) and the answer to that is smaller
    # files, not a transfer encoding.

    # THE PROTOTYPE IS NOT FOR SEARCH ENGINES.
    #
    # Unchanged, and it applies to this port word for word: it runs on the same
    # placeholder content that misstates real people — photographs of
    # identifiable public figures presented as this federation's champions and
    # officers (R11, R16), and invented DWF headlines attached to press photos of
    # real athletes (R13). Those are all recorded as "must be resolved before
    # publication", and an indexed public URL is publication. Remove this header
    # only when those three risks are closed.
    add_header X-Robots-Tag "noindex, nofollow" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Files under public/, served by Nitro with no cache header at all —
    # measured, same as Next. A day is the compromise: it spares the box from
    # re-sending multi-megabyte artwork on every visit, and a replaced photo is
    # live within a day without a cache purge.
    location /assets/ {
        proxy_pass http://127.0.0.1:3036;
        proxy_set_header Host $host;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # NEW — no counterpart in the Next config, and the reason this file could not
    # simply be the old one with a different port.
    #
    # `/_ipx/` is @nuxt/image's transform endpoint: every resized candidate in
    # every `srcset` is a live sharp call. It is now set to a day at the app
    # layer (`runtimeConfig.ipx.maxAge` — its default is 60 seconds, measured),
    # so nginx must NOT override that header the way it overrides `/assets/`.
    # What it adds instead is a disk cache in front of it, which is what stops
    # the box re-encoding the hero rocks for every visitor whose browser cache
    # is cold.
    #
    # Needs a matching zone at the http{} level, once, in nginx.conf:
    #
    #   proxy_cache_path /var/cache/nginx/dwf-ipx levels=1:2
    #                    keys_zone=dwf_ipx:10m max_size=1g inactive=7d
    #                    use_temp_path=off;
    #
    # Without that line nginx fails `-t` with "zone dwf_ipx not found" — it is
    # not optional, and it cannot live in this file.
    location /_ipx/ {
        proxy_pass http://127.0.0.1:3036;
        proxy_set_header Host $host;

        proxy_cache dwf_ipx;
        # The full URI is the key: the transform's modifiers are IN the path
        # (`/_ipx/q_82&s_888x361/assets/...`), so two candidates of one source
        # never collide.
        proxy_cache_key $scheme$proxy_host$request_uri;
        proxy_cache_valid 200 7d;
        # One cold request does the encode; the rest of a burst wait for it
        # rather than each starting their own sharp process.
        proxy_cache_lock on;
        # Keep serving the old bytes while a stale entry is refreshed, and if
        # the upstream is down at that moment.
        proxy_cache_use_stale updating error timeout;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    location / {
        # CHANGED — 3036, not 3035. The Next prototype keeps 3035; the two are
        # meant to be able to run side by side while the port is compared.
        proxy_pass http://127.0.0.1:3036;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Nitro reads this to build absolute URLs; without it every link it
        # generates behind TLS would come back as http://.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # CHANGED — buffering is back ON, which is nginx's default, so the
        # directive is simply gone rather than set to `on`.
        #
        # The Next config turned it off for one specific reason: Next streams the
        # Suspense fallback (`app/loading.tsx`) ahead of a slow page, and a
        # buffering proxy holds the whole response so the reader gets the loading
        # screen and the page in the same paint — which is to say, never sees it.
        #
        # Neither half of that is true here. This port has no `loading.tsx` (see
        # the README: Nuxt holds the old page and raises an indicator instead),
        # and Nitro does not stream — a rendered page comes back with a
        # `Content-Length`, measured. With nothing to stream, buffering is the
        # better default: nginx takes the response at once and frees the Node
        # process instead of holding it open for a slow client.

        proxy_cache off;

        # A cold render is fast, but the first request after a reload can wait on
        # module loading. 60s is generous and still bounded.
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
